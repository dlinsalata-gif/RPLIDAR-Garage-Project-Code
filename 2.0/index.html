<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Garage Availability</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #7EC8E3;
            color: #0B3D2E;
            text-align: center;
            padding-top: 50px;
        }

        .card {
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 6px 15px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 10px;
        }

        .spots {
            font-size: 72px;
            font-weight: bold;
            margin: 20px 0;
        }

        .status {
            font-size: 18px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Open Parking Spots</h1>

        <div class="spots" id="spots">--</div>

        <div class="status" id="status">
            Loading...
        </div>
    </div>

    <script>
        function updateStatus() {
            fetch("/status")
                .then(response => response.json())
                .then(data => {
                    document.getElementById("spots").innerText = data.open_spots;
                    document.getElementById("status").innerHTML =
                        "Last Event: " + data.event + "<br>Time: " + data.event_time;
                })
                .catch(error => console.error("Fetch error:", error));
        }

        // Update twice per second
        setInterval(updateStatus, 500);

        // Initial load
        updateStatus();
    </script>

</body>
</html>

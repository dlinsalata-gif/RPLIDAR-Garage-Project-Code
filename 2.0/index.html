<!DOCTYPE html>
<html>
<head>
    <title>Garage Availability</title>
    <meta http-equiv="refresh" content="1">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #7EC8E3;
            color: #0B3D2E;
            text-align: center;
            padding-top: 50px;
        }

        .card {
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 6px 15px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 10px;
        }

        .spots {
            font-size: 72px;
            font-weight: bold;
            margin: 20px 0;
        }

        .status {
            font-size: 18px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Open Parking Spots</h1>
        <div class="spots">{{ open_spots }}</div>

        <div class="status">
            Last Event: {{ event }} <br>
            Time: {{ event_time }}
        </div>
    </div>
</body>
</html>
